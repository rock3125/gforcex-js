<!DOCTYPE html>
<html lang="en">
<head>
    <title>G-Force X</title>
    <script type="text/javascript" src="cookie.js"></script>
    <script type="text/javascript" src="const.js"></script>
    <script type="text/javascript" src="sound.js"></script>
    <script type="text/javascript" src="orb.js"></script>
    <script type="text/javascript" src="map.js"></script>
    <script type="text/javascript" src="ship.js"></script>
    <script type="text/javascript" src="turret.js"></script>
    <script type="text/javascript" src="nav.js"></script>
    <script type="text/javascript" src="enemy.js"></script>
    <link rel="stylesheet" href="main.css">
</head>
<body>
<div id="gameOver">GAME OVER</div>
<div id="nextLevel">NEXT LEVEL</div>
<div id="allOrbs">ALL ORBS COLLECTED!</div>
<div class="hud">
    ROCK'S G-FORCE X<br/><br/>
    SCORE: <span id="score">0</span><br/>
    FUEL:<br/>
    AMMO:<br/><br/>
    LIVES:<br/>
    ORBS:<br/>
</div>
<div class="controls-legend">
    <div class="control-item"><span class="key">&#8592;</span> <span class="key">&#8594;</span> Rotate</div>
    <div class="control-item"><span class="key">&#8595;</span> Thrust</div>
    <div class="control-item"><span class="key">Space</span> Fire</div>
    <div class="control-item"><span class="key">M</span> <span id="music"> Music on/off</span></div>
    <div id="restart" class="control-item" style="display: none;"><span class="key">R</span> Restart</div>
</div>

<div id="mobileControls" style="display: none; position: absolute; bottom: 20px; left: 0; width: 100%; height: 150px; pointer-events: none; z-index: 1000;">
    <div id="joystickZone" style="position: absolute; bottom: 0; left: 20px; width: 120px; height: 120px; background: rgba(255,255,255,0.1); border-radius: 50%; pointer-events: auto; touch-action: none; user-select: none; -webkit-user-select: none; border: 2px solid rgba(255,255,255,0.3);">
        <div id="joystickKnob" style="position: absolute; top: 40px; left: 40px; width: 40px; height: 40px; background: rgba(255,255,255,0.5); border-radius: 50%;"></div>
    </div>
    <div id="fireButton" style="position: absolute; bottom: 20px; right: 20px; width: 80px; height: 80px; background: rgba(255,0,0,0.3); border-radius: 50%; pointer-events: auto; display: flex; justify-content: center; align-items: center; color: white; font-weight: bold; font-family: sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; border: 2px solid rgba(255,0,0,0.5);">FIRE</div>
</div>

<canvas id="gameCanvas"></canvas>
<canvas id="minimap" width="150" height="150"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const mCanvas = document.getElementById('minimap');
    const mCtx = mCanvas.getContext('2d');
    const score_ctrl = document.getElementById('score');

    // keyboard map (key: string -> boolean)
    let keys = {};
    let gameOver = false;
    const ship = new Ship();     // you, the player
    const enemy = new Enemy();   // the AI opponent, flying out of its own base
    const player = new Player(); // audio player

    // set up a map with initial turrets and orbs
    let num_turrets = 4;
    let num_orbs = 6;
    let map = new Map(num_turrets, num_orbs);

    /**
     * restart a game - reset lives, score and screen status
     */
    function restart() {
        gameOver = false;
        keys = {};

        // the order of these calls statements is important
        let success = false; // re-create the world until it is right
        while (!success) {
            map.generateWorld();
            // both the player and the enemy need somewhere to launch from
            success = ship.reset(map) && enemy.reset(map, ship);
            map.placeTurrets(ship)
            map.placeOrbs(ship)
        }

        ship.lives = 3
        ship.score = 0
        document.getElementById('gameOver').style.display = 'none'
        document.getElementById('restart').style.display = 'none'
        document.getElementById('nextLevel').style.display = 'none'
        document.getElementById('allOrbs').style.display = 'none'
    }

    /**
     * you lose / crash / ran out of fuel
     * @param player the sound player
     */
    function triggerGameOver(player) {
        if (gameOver) return;
        gameOver = true;

        // Launch the particles at the ship's current location
        ship.createExplosion();
        if (player) player.play_explosion();
        ship.lives -= 1

        setTimeout(() => {
            gameOver = ship.lives <= 0;
            if (!gameOver) {
                ship.reset(map);
                enemy.reset(map, ship); // send the enemy home too, off the respawn point
            }
        }, 1500);
    }

    /**
     * move to the next level
     */
    function triggerNextLevel() {
        document.getElementById('nextLevel').style.display = 'block'
        if (map.collected_all_orbs()) {
            document.getElementById('allOrbs').style.display = 'block'
        }
        setTimeout(() => {
            // reset the level, and carry across our score to the next level
            let old_score = ship.score;
            // add score for reaching the next level
            if (map.collected_all_orbs()) {
                old_score += NEXT_LEVEL_SCORE_FULL;
            } else {
                old_score += NEXT_LEVEL_SCORE;
            }
            const old_lives = ship.lives + 1;       // 1 extra live

            // create the next level
            num_turrets += 2; // two more turrets
            if (num_turrets > 10) {
                num_turrets = 10;
            }
            num_orbs += 2;    // and two more orbs
            if (num_orbs > 10) {
                num_orbs = 10;
            }
            map = new Map(num_turrets, num_orbs);

            restart();

            // keep score and lives as set above
            ship.score = old_score;
            ship.lives = old_lives;

        }, 2500);
    }

    /**
     * Game main update loop (all logic)
     */
    function update() {
        ship.update(map, keys, player);
        map.update(ship, player);
        enemy.update(map, ship, player);
        player.sound_check_keys(keys);
        if (gameOver && ship.lives <= 0) {
            document.getElementById('gameOver').style.display = 'block'
            document.getElementById('restart').style.display = 'block'
            if (keys['KeyR']) {
                restart()
            }
        }
    }

    /**
     * Game main draw loop (all drawing / graphics)
     */
    function draw() {
        map.draw(ctx, mCtx, ship, enemy);
        // set the player's score as a number inside HTML
        score_ctrl.innerText = ship.score.toLocaleString()
    }

    // real time carried over between logic steps, and the timestamp of the last frame
    let step_backlog = 0;
    let last_frame_time = 0;

    /**
     * the main loop running
     *
     * The physics is per-frame, so how often we call update() is exactly how fast the
     * game plays.  Rather than tie that to the monitor, we bank up the real time that
     * has passed and spend it in fixed LOGIC_STEP_MS steps - so the game runs at the
     * same speed on a 60hz laptop and a 144hz monitor, and GAME_SPEED alone decides how
     * frantic it is.  Left over time stays in the backlog for next frame, so the average
     * rate comes out exact instead of being rounded to whole display frames.
     *
     * @param now the timestamp requestAnimationFrame hands us, in milliseconds
     */
    function loop(now) {
        // The frequency of calls to the callback function will generally match the display refresh rate.
        // The most common refresh rate is 60hz, (60 cycles/frames per second), though 75hz, 120hz, and 144hz
        // are also widely used. requestAnimationFrame() calls are paused in most browsers when running in
        // background tabs in order to improve performance and battery life.
        requestAnimationFrame(loop);

        // the very first frame has nothing to measure from
        if (last_frame_time === 0) {
            last_frame_time = now;
            return;
        }

        // how much real time to account for, capped so that coming back to a backgrounded
        // tab doesn't fast-forward the game through a hundred steps at once
        let elapsed = now - last_frame_time;
        last_frame_time = now;
        if (elapsed > MAX_FRAME_MS) elapsed = MAX_FRAME_MS;

        step_backlog += elapsed;
        let stepped = false;
        while (step_backlog >= LOGIC_STEP_MS) {
            step_backlog -= LOGIC_STEP_MS;
            update();
            stepped = true;
        }

        // only worth redrawing if something actually moved
        if (stepped) draw();
    }

    // set up keyboard processing
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    // set up screen resize logic
    window.addEventListener('resize', () => {
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    });
    canvas.width = window.innerWidth; canvas.height = window.innerHeight;

    // music cookie (just in case it wasn't yet set)
    set_cookie("title_music", player.music_on ? "on" : "off", 7);

    // --- Mobile Controls Logic ---
    const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
    if (isTouchDevice) {
        document.getElementById('mobileControls').style.display = 'block';
        document.querySelector('.controls-legend').style.display = 'none';

        const joystickZone = document.getElementById('joystickZone');
        const joystickKnob = document.getElementById('joystickKnob');
        const fireButton = document.getElementById('fireButton');

        // Joystick state
        let joyTouchId = null;
        let joyCenterX = 0;
        let joyCenterY = 0;
        const maxRadius = 40;

        joystickZone.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (joyTouchId === null) {
                const touch = e.changedTouches[0];
                joyTouchId = touch.identifier;
                const rect = joystickZone.getBoundingClientRect();
                joyCenterX = rect.left + rect.width / 2;
                joyCenterY = rect.top + rect.height / 2;
                updateJoystick(touch.clientX, touch.clientY);
            }
        }, { passive: false });

        joystickZone.addEventListener('touchmove', (e) => {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                const touch = e.changedTouches[i];
                if (touch.identifier === joyTouchId) {
                    updateJoystick(touch.clientX, touch.clientY);
                    break;
                }
            }
        }, { passive: false });

        const resetJoystick = () => {
            joyTouchId = null;
            joystickKnob.style.transform = `translate(0px, 0px)`;
            keys['ArrowLeft'] = false;
            keys['ArrowRight'] = false;
            keys['ArrowDown'] = false;
        };

        joystickZone.addEventListener('touchend', (e) => {
            e.preventDefault();
            for (let i = 0; i < e.changedTouches.length; i++) {
                if (e.changedTouches[i].identifier === joyTouchId) {
                    resetJoystick();
                    break;
                }
            }
        }, { passive: false });

        joystickZone.addEventListener('touchcancel', resetJoystick);

        function updateJoystick(clientX, clientY) {
            let dx = clientX - joyCenterX;
            let dy = clientY - joyCenterY;
            const distance = Math.sqrt(dx * dx + dy * dy);
            
            if (distance > maxRadius) {
                dx = (dx / distance) * maxRadius;
                dy = (dy / distance) * maxRadius;
            }
            
            joystickKnob.style.transform = `translate(${dx}px, ${dy}px)`;

            // Update keys based on joystick position
            // Threshold for activation: 25px (increased from 15px to make it less sensitive)
            keys['ArrowLeft'] = dx < -25;
            keys['ArrowRight'] = dx > 25;
            // Map either UP or DOWN to thrust since it's an asteroid style game
            keys['ArrowDown'] = dy < -25 || dy > 25;
        }

        // Fire Button Logic
        fireButton.addEventListener('touchstart', (e) => {
            e.preventDefault();
            keys['Space'] = true;
            fireButton.style.background = 'rgba(255,0,0,0.6)';
        }, { passive: false });

        const resetFire = (e) => {
            if (e) e.preventDefault();
            keys['Space'] = false;
            fireButton.style.background = 'rgba(255,0,0,0.3)';
        };

        fireButton.addEventListener('touchend', resetFire, { passive: false });
        fireButton.addEventListener('touchcancel', resetFire, { passive: false });
        
        // Also add restart support by tapping the screen if game over
        canvas.addEventListener('touchstart', (e) => {
            if (gameOver && ship.lives <= 0) {
                keys['KeyR'] = true;
                setTimeout(() => keys['KeyR'] = false, 100);
            }
        }, { passive: false });
    }
    // --- End Mobile Controls Logic ---

    // restart (first start) game logic
    restart();
    // loop forever - let requestAnimationFrame supply the first timestamp
    requestAnimationFrame(loop);
</script>

</body>
</html>
